<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Detail Berita - UPTD Puskesmas Haur Gading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- 1. NAVBAR / HEADER (VERSI 2 LOGO) -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Logo Kabupaten HSU & Logo Puskesmas Haur Gading -->
            <a href="index.html" class="flex items-center space-x-3">
                <img src="assets/logo-hsu.png" alt="Logo Kabupaten HSU" class="w-10 h-10 object-contain bg-white rounded-full p-1 shadow-sm" onerror="this.src='Logo HSU.png'">
                <img src="assets/logo-puskesmas.png" alt="Logo Puskesmas Haur Gading" class="w-10 h-10 object-contain bg-white rounded-full p-1 shadow-sm" onerror="this.src='Logo Puskesmas.png'">
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight">PUSKESMAS HAUR GADING</h1>
                    <p class="text-xs text-emerald-100">Kabupaten Hulu Sungai Utara</p>
                </div>
            </a>
            
            <!-- Tombol Kembali -->
            <a href="berita.html" class="text-xs bg-emerald-800 hover:bg-emerald-900 text-white px-3.5 py-2 rounded-xl border border-emerald-600 transition flex items-center gap-1.5 shadow-sm">
                <i class="fas fa-arrow-left text-[10px]"></i>
                <span class="hidden sm:inline">Kembali ke Berita</span>
            </a>
        </div>
    </header>

<!-- 2. BANNER HEADER ARTIKEL (RINGKAS & COMPACT) -->
<section class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-white py-4 md:py-5 px-4 shadow-sm">
    <div class="container mx-auto max-w-4xl">
        <!-- Breadcrumb & Detail Ringkas -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <nav class="text-[11px] text-emerald-200 flex items-center gap-1.5">
                <a href="index.html" class="hover:underline">Beranda</a> &rsaquo;
                <a href="berita.html" class="hover:underline">Berita</a> &rsaquo;
                <span id="breadcrumbJudul" class="text-white font-medium truncate max-w-[200px] sm:max-w-xs">Detail Artikel</span>
            </nav>

            <div class="flex items-center gap-2">
                <span id="beritaKategori" class="bg-amber-400 text-emerald-950 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full shadow-sm">
                    Kategori
                </span>
                <span class="text-[11px] text-emerald-200 flex items-center gap-1">
                    <i class="far fa-calendar-alt"></i> <span id="beritaTanggal">--</span>
                </span>
            </div>
        </div>

        <!-- Judul Berita -->
        <h1 id="beritaJudul" class="text-lg md:text-xl font-bold leading-snug tracking-tight">
            Judul Artikel Berita
        </h1>
    </div>
</section>

<!-- 3. KONTEN ARTIKEL UTAMA (NAIK KE ATAS) -->
<main class="container mx-auto max-w-4xl px-4 py-4 md:py-6 flex-grow">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 md:p-6 space-y-5">
        
        <!-- Gambar Utama / Poster -->
        <div class="w-full bg-gray-100 rounded-xl overflow-hidden border border-gray-200 flex justify-center">
            <img id="beritaGambar" src="" alt="Gambar Berita" class="w-full max-h-[450px] object-contain">
        </div>

        <!-- Isi Paragraf Artikel -->
        <div id="beritaIsi" class="text-xs md:text-sm text-gray-700 leading-relaxed space-y-3 whitespace-pre-line border-t pt-4">
            <!-- Teks Berita Diresapi Otomatis -->
        </div>

        <!-- Tombol Navigasi Bawah -->
        <div class="border-t pt-4 flex justify-between items-center">
            <a href="berita.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 hover:text-emerald-900 transition">
                <i class="fas fa-arrow-left"></i> Lihat Berita Lainnya
            </a>
        </div>

    </div>
</main>

    <!-- SCRIPT OTOMATIS AMBIL DATA DARI URL -->
    <script>
        const dataBerita = {
            "skm": {
                kategori: "Hasil SKM",
                tanggal: "20 Agustus 2026",
                gambar: "assets/skm.png",
                judul: "Hasil Survei Kepuasan Masyarakat di Puskesmas Haur Gading",
                isi: `Berdasarkan Peraturan Menteri PANRB Nomor 14 Tahun 2017, UPTD Puskesmas Haur Gading telah menyelesaikan rekapitulasi penilaian SKM Periode Semester I Tahun 2026.\n\nDari hasil pengolahan data kuesioner masyarakat dan pasien, diperoleh nilai Indeks Kepuasan Masyarakat (IKM) sebesar 82,13 dengan Mutu Pelayanan B (SANGAT BAIK).\n\nTerima kasih atas kepercayaan dan masukan dari seluruh masyarakat Kecamatan Haur Gading. Nilai ini menjadi motivasi bagi seluruh staf UPTD Puskesmas Haur Gading untuk terus meningkatkan mutu dan kenyamanan pelayanan kesehatan bagi masyarakat.`
            },
            "dbd": {
                kategori: "Isi Kategori 2",
                tanggal: "12 Agustus 2026",
                gambar: "assets/penyuluhan.jpg",
                judul: "Berita 2",
                isi: `Isi Berita 2\n\nDal\n\nE`
            },
            "lansia": {
                kategori: "Isi Kategori 3",
                tanggal: "5 Agustus 2026",
                gambar: "assets/lansia.jpg",
                judul: "Pelaksanaan Senam & Skrining Kesehatan Lansia Rutin",
                isi: `Isi Berita 3`
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const idBerita = urlParams.get('id');

        if (idBerita && dataBerita[idBerita]) {
            const item = dataBerita[idBerita];
            document.getElementById('pageTitle').innerText = item.judul + " - UPTD Puskesmas Haur Gading";
            document.getElementById('breadcrumbJudul').innerText = item.judul;
            document.getElementById('beritaKategori').innerText = item.kategori;
            document.getElementById('beritaTanggal').innerText = item.tanggal;
            document.getElementById('beritaJudul').innerText = item.judul;
            document.getElementById('beritaGambar').src = item.gambar;
            document.getElementById('beritaIsi').innerText = item.isi;
        } else {
            document.getElementById('beritaJudul').innerText = "Berita Tidak Ditemukan";
            document.getElementById('beritaIsi').innerText = "Maaf, berita yang Anda cari tidak ditemukan atau telah dihapus.";
        }
    </script>
</body>
</html>
